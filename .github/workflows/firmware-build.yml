name: firmware-build

# メイン基板のファームウェア（CubeMX が生成した CMake プロジェクト）が ARM 向けにビルドできることと、
# App/ の PC 上のテスト（test/ の make：test_mode・test_output・test_flash・test_maze・test_trajectory・test_wall_dist・test_turn）が通ることを確認する。
# ジョブの名前 maze-test は、PR のチェックの名前として使われているので変えない（中身は 7 つのテスト全部）。
on:
  push:
    branches: [main]
    paths: ['software/main-controller/TORANEKO.Mk3/**', 'software/main-controller/test/**', '.github/workflows/firmware-build.yml']
  pull_request:
    paths: ['software/main-controller/TORANEKO.Mk3/**', 'software/main-controller/test/**', '.github/workflows/firmware-build.yml']

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: software/main-controller/TORANEKO.Mk3
    steps:
      - uses: actions/checkout@v4

      - name: ツールチェーンのインストール
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build

      - name: ビルド (Debug)
        shell: bash  # パイプ（| tee）の前のビルドが失敗したときに、このステップを失敗にする（pipefail が付く）
        run: |
          cmake --preset Debug
          cmake --build --preset Debug 2>&1 | tee build.log

      - name: 警告がないこと（CLAUDE.md のルール。警告が 1 つでもあれば失敗にする）
        run: |
          if grep -q "warning:" build.log; then
            grep "warning:" build.log
            exit 1
          fi

      - name: サイズ（プログラムは Flash の前の 256KB に収める。後ろの 256KB は迷路とゴールの保存場所。MODES.md の 5）
        shell: bash
        run: |
          arm-none-eabi-size build/Debug/TORANEKO.Mk3.elf
          # Flash に入る大きさ = text（プログラムと定数）+ data（変数の初めの値）
          flash_bytes=$(arm-none-eabi-size build/Debug/TORANEKO.Mk3.elf | awk 'NR == 2 { print $1 + $2 }')
          if [ "$flash_bytes" -gt 262144 ]; then
            echo "プログラムが 256KB を超えた（${flash_bytes} バイト）。保存場所（セクタ6・7）と重なるので、保存したときにプログラムが消える"
            exit 1
          fi

  maze-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: software/main-controller/test
    steps:
      - uses: actions/checkout@v4

      - name: PC 上のテスト（test_mode・test_output・test_flash・test_maze・test_trajectory・test_wall_dist・test_turn）
        run: make
