<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToraNeko ビューア</title>
<!--
  ToraNeko.Mk3 のUART出力を、そのままグラフ・表・迷路にするページ。
  KOGUMA MkIIl のビューア(software/reference/koguma-mkiil/tools/viewer.html、2026-10-12)を写して、
  ToraNeko 用に直したもの(2026-10-25):
    - 種類 SENSOR(センサ値の記録、モード5 No.2)と RESULT(調整の動きの結果)を足した
    - 「メモ」に書いたこと(例: R 64mm)を、保存するファイルの名前と中身に入れる
    - 横の壁までの距離は区画中心で 42mm、電圧は V
  ネットは使わない(外から何も読み込まない)。Windows + Chrome / Edge で、このファイルを開いて使う。

  - 「接続」: USBシリアル(115200)を Web Serial で読む。Tera Term は閉じておく(同じCOMポートは1つしか開けない)
  - 「保存先フォルダ」: 選ぶと、届いたデータを1つずつファイルにして自動で保存する(リポジトリの logs/ を選ぶとよい)
  - 「ファイルを開く」: 保存したファイルや、Tera Term のログを読み込んで表示する

  ロボットの出力は、#BEGIN 種類 項目=値 ... で始まり #END 種類 で終わる(LOG / MAZE / SENSOR / RESULT。
  EDGE / CENTER / NOISE は KOGUMA のもので、ToraNeko はまだ出さない)。形は ../logs/README.md を見る。
-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ed;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s7: #6250d6;
  --good: #006300;
  --bad: #c62828;
  --sel: rgba(42,120,214,0.12);
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s7: #9085e9;
    --good: #0ca30c;
    --bad: #e66767;
    --sel: rgba(57,135,229,0.18);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s7: #9085e9;
  --good: #0ca30c;
  --bad: #e66767;
  --sel: rgba(57,135,229,0.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); }
button, select, input { font: inherit; color: inherit; }
button {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 12px; cursor: pointer;
}
button:hover { background: var(--surface-2); }
button.primary { background: var(--s1); color: #fff; border-color: transparent; }
button:disabled { opacity: .5; cursor: default; }
.app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
}
header h1 { font-size: 16px; margin: 0 12px 0 0; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.pill.on { color: var(--good); }
.spacer { flex: 1; }
.main { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--border); overflow: auto; background: var(--surface); }
aside .head { padding: 8px 12px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.blk { padding: 8px 12px; border-top: 1px solid var(--border); cursor: pointer; }
.blk:hover { background: var(--surface-2); }
.blk.sel { background: var(--sel); }
.blk .t { font-weight: 600; }
.blk .s { font-size: 12px; color: var(--ink-2); }
.blk .cmp { font-size: 12px; color: var(--muted); }
.view { overflow: auto; padding: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.card h3 { font-size: 13px; margin: 12px 0 4px; color: var(--ink-2); }
.note { font-size: 12px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; }
td.l, th.l { text-align: left; }
pre { font: 12px/1.45 var(--mono); margin: 0; white-space: pre; overflow: auto; }
.chart { position: relative; margin-bottom: 4px; }
.chart canvas { display: block; width: 100%; }
.chart .title { font-size: 12px; color: var(--ink-2); display: flex; gap: 12px; align-items: center; }
.key { display: inline-flex; align-items: center; gap: 4px; }
.key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; }
.key i.dash { border-top-style: dashed; }
.key i.dot { width: 8px; height: 8px; border-radius: 50%; border: none; }
.tip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  font-variant-numeric: tabular-nums;
}
.tip b { color: var(--ink); }
.tip .n { color: var(--ink-2); }
footer { border-top: 1px solid var(--border); background: var(--surface); }
footer .bar { display: flex; gap: 8px; align-items: center; padding: 4px 16px; font-size: 12px; color: var(--muted); }
#console { height: 160px; overflow: auto; padding: 4px 16px 8px; border-top: 1px solid var(--grid); }
#console.hide { display: none; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.copyline { display: flex; gap: 8px; align-items: center; margin: 2px 0; }
.copyline code { font: 12px var(--mono); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
.warn { color: var(--bad); }
.maze-wrap { display: flex; flex-wrap: wrap; gap: 16px; }
.maze-wrap canvas { background: var(--surface); }
.zoomreset { font-size: 12px; padding: 2px 10px; }
.tile { background: var(--surface-2); border-radius: 6px; padding: 4px 12px; min-width: 72px; }
.tile b { font-size: 18px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ToraNeko ビューア</h1>
    <button id="bConnect" class="primary">接続</button>
    <button id="bDisconnect" disabled>切断</button>
    <span id="status" class="pill">未接続</span>
    <button id="bDir">保存先フォルダ</button>
    <span id="dirName" class="pill">保存しない</span>
    <input id="memo" type="text" placeholder="メモ(例: R 64mm)" title="ここに書いたことを、次に届いたデータのファイル名と中身に入れる" style="width:12em">
    <button id="bOpen">ファイルを開く</button>
    <input id="fOpen" type="file" multiple accept=".txt,.log,.csv" hidden>
    <span class="spacer"></span>
    <button id="bSession" title="このページを開いてから届いたものを全部、1つのファイルにする">ぜんぶ保存</button>
  </header>
  <div class="main">
    <aside>
      <div class="head"><span>届いたデータ</span><span id="count">0</span></div>
      <div id="list"></div>
    </aside>
    <div class="view" id="view">
      <div class="empty" id="welcome"></div>
    </div>
  </div>
  <footer>
    <div class="bar">
      <button id="bConsole">コンソール</button>
      <span id="lastLine"></span>
      <span class="spacer"></span>
      <button id="bClear">コンソールを消す</button>
    </div>
    <pre id="console" class="hide"></pre>
  </footer>
</div>
<div class="tip" id="tip"></div>
<script>
"use strict";
/* ================= 共通 ================= */
const $ = (id) => document.getElementById(id);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (v, d = 1) => (v == null || !isFinite(v)) ? "-" : v.toFixed(d);
const pad2 = (n) => String(n).padStart(2, "0");
const stamp = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
const timeStr = (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
function stats(a) {
  const n = a.length;
  if (!n) return { n: 0 };
  let s = 0, mn = Infinity, mx = -Infinity;
  for (const v of a) { s += v; if (v < mn) mn = v; if (v > mx) mx = v; }
  const mean = s / n;
  let q = 0;
  for (const v of a) q += (v - mean) * (v - mean);
  return { n, mean, min: mn, max: mx, range: mx - mn, sd: n > 1 ? Math.sqrt(q / (n - 1)) : 0 };
}
function niceTicks(lo, hi, count) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / Math.max(1, count);
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  const step = (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
  const t = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-6; v += step) t.push(+v.toFixed(10));
  return { ticks: t, step };
}
const tip = $("tip");
function showTip(x, y, rows) {
  tip.replaceChildren(...rows);
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, x + 14) + "px";
  tip.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2)) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
function tipRow(color, value, name, dashed) {
  const k = el("i");
  k.style.borderTopColor = color;
  if (dashed) k.className = "dash";
  return el("div", { class: "key" }, k, el("b", { text: value }), el("span", { class: "n", text: name }));
}

/* ================= 受け取ったデータ ================= */
const blocks = [];
let selected = null, compare = null;
let sessionText = "";
const SESSION_MAX = 10e6;	//「ぜんぶ保存」用に覚えておく文字の上限(これを超えたら古いほうから捨てる)
let sessionTrimmed = false;
function addSession(text) {
  sessionText += text;
  if (sessionText.length > SESSION_MAX * 1.2) { sessionText = sessionText.slice(-SESSION_MAX); sessionTrimmed = true; }
}
const consoleLines = [];
const CONSOLE_MAX = 3000;

class Parser {
  constructor(onLine, onBlock) { this.buf = ""; this.cur = null; this.onLine = onLine; this.onBlock = onBlock; }
  feed(text) {
    /* まとめて行に分け、最後の行(まだ改行が来ていない)だけ残す。\r\n が届く途中で切れても空行が1つ増えるだけ */
    const parts = (this.buf + text).split(/\r\n|\n|\r/);
    this.buf = parts.pop();
    for (const line of parts) this.line(line);
  }
  flush() { if (this.buf) { this.line(this.buf); this.buf = ""; } }
  line(line) {
    this.onLine(line);
    const t = line.trim();
    if (t.startsWith("# memo:")) {
      this.memo = t.slice(7).trim();	//保存したファイルの先頭のメモ。次のデータに付ける
    } else if (t.startsWith("#BEGIN ")) {
      const parts = t.slice(7).trim().split(/\s+/);
      const params = {};
      for (const p of parts.slice(1)) { const k = p.indexOf("="); if (k > 0) params[p.slice(0, k)] = p.slice(k + 1); }
      this.cur = { type: parts[0], params, head: t, lines: [], time: new Date(), memo: this.memo || "" };
      this.memo = "";
    } else if (t.startsWith("#END")) {
      if (this.cur) { const b = this.cur; this.cur = null; b.raw = [b.head, ...b.lines, t].join("\n") + "\n"; this.onBlock(b); }
    } else if (this.cur) {
      if (t.length) this.cur.lines.push(t);
    }
  }
}

function addLine(line) {
  consoleLines.push(line);
  if (consoleLines.length > CONSOLE_MAX) consoleLines.splice(0, consoleLines.length - CONSOLE_MAX);
  consoleDirty = true;
  if (line.trim()) $("lastLine").textContent = line.slice(0, 120);
}
let consoleDirty = false;
setInterval(() => {
  if (!consoleDirty) return;
  consoleDirty = false;
  const c = $("console");
  const atEnd = c.scrollTop + c.clientHeight >= c.scrollHeight - 20;
  c.textContent = consoleLines.join("\n");
  if (atEnd) c.scrollTop = c.scrollHeight;
}, 300);

function summary(b) {
  const p = b.params;
  if (b.type === "LOG") return `${Math.max(0, b.lines.length - 1)} 行(${fmt((b.lines.length - 1) * (+p.dt || 0.001), 2)} 秒)`;
  if (b.type === "EDGE") {
    const nf = b.lines.filter((l) => l.startsWith("fall,")).length;
    return (+p.border >= 0 ? `テスト ${p.v} mm/s` : "最短走行") + ` 柱の端 ${nf}`;
  }
  if (b.type === "MAZE") return `${p.size}×${p.size}`;
  if (b.type === "SENSOR") return sensorRows(b).map((r) => `${r.name} ${fmt(r.average, 0)}`).join(" ");
  if (b.type === "NOISE") { const n = b.lines.filter((l) => l.startsWith("batt,")).length; return `${n} 組${+p.trace > 0 ? "(生の値あり)" : "(表だけ)"}`; }
  if (STREAM_TYPES.has(b.type) && b.updates > 1) return `測定中 ${b.updates} 回(最後 ${timeStr(b.lastTime)})`;
  return `${b.lines.length} 行`;
}
const typeName = { LOG: "走行ログ", EDGE: "壁切れ", MAZE: "迷路", CENTER: "感度合わせ", NOISE: "センサのノイズ", SENSOR: "センサ値の記録", RESULT: "調整の結果" };

let bulk = false;	//ファイルを読み込むあいだは、データ1つごとに描き直さない(終わってから1回だけ)
/* 測っているあいだ出し続ける種類(感度合わせ)。続けて届いたら一覧に増やさず、いちばん新しい値に置き換える。
 * 自動では保存しない(残したいときは「ファイルに保存」) */
const STREAM_TYPES = new Set(["CENTER"]);
const STREAM_GAP_MS = 5000;	//これより間が空いたら、新しい測定として一覧に足す
function addBlock(b, source) {
  const last = blocks[blocks.length - 1];
  if (source === "serial" && STREAM_TYPES.has(b.type) && last && last.type === b.type && last.source === "serial"
      && b.time - last.lastTime < STREAM_GAP_MS) {
    last.lines = b.lines; last.raw = b.raw; last.params = b.params; last.lastTime = b.time;
    last.updates = (last.updates || 1) + 1;
    renderList();
    if (selected === last) renderView();
    return;
  }
  b.lastTime = b.time;
  b.id = blocks.length + 1;
  b.source = source;
  if (b.memo == null) b.memo = "";
  if (source === "serial") {
    const memo = $("memo").value.trim();
    if (memo) { b.memo = memo; b.raw = `# memo: ${memo}\n` + b.raw; }	//メモはファイルの先頭の行に入れる(開いたときに読める)
  }
  blocks.push(b);
  if (source === "serial" && !STREAM_TYPES.has(b.type)) autoSave(b);
  if (bulk) return;
  /* 出力(迷路 → 壁切れ → 走行ログ)は続けて届くので、少し待って最後のものだけ描く */
  clearTimeout(selectTimer);
  selectTimer = setTimeout(() => select(b), 60);
  renderList();
}
let selectTimer = 0;
function renderList() {
  $("count").textContent = blocks.length;
  const list = $("list");
  list.replaceChildren();
  if (live.t.length) {
    const d = el("div", { class: "blk" + (selected === LIVE ? " sel" : "") },
      el("div", { class: "t", text: "センサの値(そのまま)" }),
      el("div", { class: "s", text: `${live.kind === "cal" ? "距離の表(モード3 No.4)" : "センサ表示(モード4 No.0)"}・${live.rate} 行/秒` }));
    d.addEventListener("click", () => select(LIVE));
    list.append(d);
  }
  for (const b of [...blocks].reverse()) {
    const d = el("div", { class: "blk" + (b === selected ? " sel" : "") },
      el("div", { class: "t", text: `${typeName[b.type] || b.type}  ${timeStr(b.time)}` + (b.memo ? `  [${b.memo}]` : "") }),
      el("div", { class: "s", text: summary(b) + (b.source !== "serial" ? `(${b.source})` : "") + (b.saved ? " ・保存済み" : "") }));
    if (b.type === "LOG" && selected && selected.type === "LOG" && b !== selected) {
      const c = el("label", { class: "cmp" });
      const cb = el("input", { type: "checkbox" });
      cb.checked = compare === b;
      cb.addEventListener("click", (e) => { e.stopPropagation(); compare = cb.checked ? b : null; renderList(); renderView(); });
      c.append(cb, " 破線で重ねる");
      d.append(c);
    }
    d.addEventListener("click", () => select(b));
    list.append(d);
  }
}
function select(b) {
  if (selected !== b) { if (!b || b.type !== "LOG") compare = null; if (compare === b) compare = null; }
  selected = b;
  renderList();
  renderView();
}

/* ================= シリアル(Web Serial) ================= */
let port = null, reader = null;
const serialParser = new Parser((l) => { addLine(l); liveLine(l); }, (b) => addBlock(b, "serial"));
function setStatus(text, on) { const s = $("status"); s.textContent = text; s.classList.toggle("on", !!on); }
async function connect() {
  if (!("serial" in navigator)) {
    alert("このブラウザでは USB シリアルを読めません。Windows の Chrome か Edge で開いてください。"
      + (window.isSecureContext ? "" : "\nファイルをダブルクリックで開いてだめなときは、README の「ビューア」にある localhost での開き方を使ってください。"));
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
  } catch (e) {
    port = null;
    if (e.name !== "NotFoundError") alert("接続できませんでした: " + e.message + "\nTera Term などで同じ COM ポートを開いていたら閉じてください。");
    return;
  }
  $("bConnect").disabled = true;
  $("bDisconnect").disabled = false;
  setStatus("接続中 115200", true);
  $("console").classList.remove("hide");
  readLoop();
}
async function readLoop() {
  const dec = new TextDecoder();
  while (port && port.readable) {
    reader = port.readable.getReader();
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const text = dec.decode(value, { stream: true });
        addSession(text);
        serialParser.feed(text);
      }
    } catch (e) {
      addLine("[読み取りエラー: " + e.message + "]");
    } finally {
      reader.releaseLock();
      reader = null;
    }
    if (!port || !port.readable) break;
  }
  await closePort();
}
async function closePort() {
  if (port) { try { await port.close(); } catch (e) { /* もう閉じている */ } }
  port = null;
  $("bConnect").disabled = false;
  $("bDisconnect").disabled = true;
  setStatus("未接続", false);
}
async function disconnect() {
  const p = port;
  port = null;
  if (reader) { try { await reader.cancel(); } catch (e) { /* */ } }
  if (p) { try { await p.close(); } catch (e) { /* */ } }
  await closePort();
}
if ("serial" in navigator) {
  navigator.serial.addEventListener("disconnect", () => { addLine("[USBシリアルが抜けました]"); disconnect(); });
}

/* ================= 保存 ================= */
let dirHandle = null;
function fileName(b) {
  const v = b.type === "EDGE" && +b.params.border >= 0 ? `_v${b.params.v}` : "";
  const memo = b.memo ? "_" + b.memo.replace(/[\\/:*?"<>|\s]+/g, "-") : "";	//ファイル名に使えない文字と空白は - にする
  return `${stamp(b.time)}_${b.type.toLowerCase()}${v}${memo}.txt`;
}
async function pickDir() {
  if (!window.showDirectoryPicker) { alert("このブラウザではフォルダに保存できません。各データの「ファイルに保存」を使ってください。"); return; }
  try {
    dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
    $("dirName").textContent = "保存先: " + dirHandle.name;
    $("dirName").classList.add("on");
  } catch (e) { /* やめた */ }
}
async function writeFile(name, text) {
  const fh = await dirHandle.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(text);
  await w.close();
}
async function autoSave(b) {
  if (!dirHandle) return;
  try { await writeFile(fileName(b), b.raw); b.saved = true; renderList(); }
  catch (e) { addLine("[保存できませんでした: " + e.message + "]"); }
}
function download(name, text) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "text/plain" })), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function saveSession() {
  if (!sessionText) { alert("まだ何も届いていません。"); return; }
  if (sessionTrimmed) alert(`長くなったので、最後の約${SESSION_MAX / 1e6}MB(約${Math.round(SESSION_MAX / 11500 / 60)}分ぶん)だけ保存します。`);
  const name = `${stamp(new Date())}_session.txt`;
  if (dirHandle) { try { await writeFile(name, sessionText); alert(name + " を保存しました。"); return; } catch (e) { /* ダウンロードにする */ } }
  download(name, sessionText);
}

/* ================= ファイルを開く ================= */
async function openFiles(files) {
  bulk = true;
  try {
    for (const f of files) {
      const text = await f.text();
      const p = new Parser(() => {}, (b) => { b.time = new Date(f.lastModified); addBlock(b, f.name); });
      p.feed(text); p.flush();
      /* 古い形(#BEGIN がない)の迷路・ログも読む */
      if (!/#BEGIN /.test(text)) legacy(text, f);
    }
  } finally {
    bulk = false;
    renderList();
    if (blocks.length) select(blocks[blocks.length - 1]);
  }
}
function legacy(text, f) {
  const lines = text.split(/\r\n|\n|\r/).map((l) => l.trim());
  const time = new Date(f.lastModified);
  const mi = lines.findIndex((l) => l.startsWith("MAZE_DUMP_BEGIN"));
  if (mi >= 0) {
    const size = +lines[mi].split(/\s+/)[1] || 16;
    addBlock({ type: "MAZE", params: { size: String(size) }, lines: lines.slice(mi).filter(Boolean), time, raw: text }, f.name);
    return;
  }
  const csv = lines.filter((l) => /^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){10}$/.test(l));
  if (csv.length > 10) {
    addBlock({ type: "LOG", params: { dt: "0.001" }, lines: ["t,v,v_target,w,w_target,sensor_L,sensor_R,volt_L,volt_R,wall_err,wall_out", ...csv], time, raw: text }, f.name);
  }
}

/* ================= 線グラフ(走行ログ) ================= */
/* 複数のグラフで、横軸の範囲(拡大)と、指している時刻を共有する */
/* 拡大を戻す: 拡大しているあいだだけ出るボタン、ダブルクリック、Esc キー(表示しているグラフ全部) */
let zoomResetters = [];	//表示を作り直すたびに空にする
function zoomButton(reset) {
  const btn = el("button", { class: "zoomreset", text: "拡大を元に戻す(Esc)" });
  btn.style.display = "none";
  btn.addEventListener("click", reset);
  zoomResetters.push(reset);
  return btn;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !e.target.closest("input, select, textarea")) zoomResetters.forEach((f) => f());
});
class LinkedX {
  constructor() { this.charts = []; this.lo = null; this.hi = null; this.hover = null; this.onRange = null; this.btns = []; }
  setRange(lo, hi) {
    this.lo = lo; this.hi = hi; this.charts.forEach((c) => c.draw()); if (this.onRange) this.onRange();
    for (const b of this.btns) b.style.display = lo == null ? "none" : "";
  }
  /* 拡大しているあいだだけ出る「元に戻す」ボタン */
  resetButton() { const b = zoomButton(() => this.setRange(null, null)); this.btns.push(b); return b; }
  /* 指している時刻が変わったら、次の描画のときに縦線だけ描き直す(グラフ本体は描き直さない) */
  setHover(x) {
    this.hover = x;
    if (this.raf) return;
    this.raf = requestAnimationFrame(() => { this.raf = 0; this.charts.forEach((c) => c.draw()); });
  }
}
class LineChart {
  /* series: [{ name, color, x: Float64Array, y: Float64Array, dashed }] */
  /* opt: { xName: 横軸の名前, xDigits: 桁, marks: [{ x, color, dashed }] 縦線, points: [{ x, y, color, label }] 点 } */
  constructor(parent, title, unit, series, link, height = 150, opt = {}) {
    this.series = series; this.link = link; this.unit = unit; this.h = height; this.opt = opt;
    const head = el("div", { class: "title" }, el("span", { text: title + (unit ? ` [${unit}]` : "") }));
    for (const s of series) {
      const k = el("i"); k.style.borderTopColor = s.color; if (s.dashed) k.className = "dash";
      head.append(el("span", { class: "key" }, k, el("span", { text: s.name })));
    }
    this.canvas = el("canvas");
    this.wrap = el("div", { class: "chart" }, head, this.canvas);
    parent.append(this.wrap);
    let x0 = 0, xmin = Infinity, xmax = -Infinity;
    for (const s of series) for (let i = 0; i < s.x.length; i++) { if (s.x[i] < xmin) xmin = s.x[i]; if (s.x[i] > xmax) xmax = s.x[i]; }
    this.full = [xmin, xmax];
    link.charts.push(this);
    this.drag = null;
    const pos = (e) => { const r = this.canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    this.canvas.addEventListener("pointermove", (e) => {
      const [px] = pos(e);
      const x = this.px2x(px);
      if (this.drag) { this.drag.x1 = x; this.link.charts.forEach((c) => c.draw()); }
      this.link.setHover(x);
      this.tooltip(e, x);
    });
    this.canvas.addEventListener("pointerleave", () => { this.link.setHover(null); hideTip(); });
    this.canvas.addEventListener("pointerdown", (e) => { const x = this.px2x(pos(e)[0]); this.drag = { x0: x, x1: x }; this.canvas.setPointerCapture(e.pointerId); });
    this.canvas.addEventListener("pointerup", () => {
      if (!this.drag) return;
      const { x0: a, x1: b } = this.drag; this.drag = null;
      const [lo, hi] = this.range();
      if (Math.abs(b - a) > (hi - lo) * 0.01) this.link.setRange(Math.min(a, b), Math.max(a, b)); else this.link.charts.forEach((c) => c.draw());
    });
    this.canvas.addEventListener("dblclick", () => this.link.setRange(null, null));
    new ResizeObserver(() => this.draw()).observe(this.wrap);
  }
  range() { return [this.link.lo ?? this.full[0], this.link.hi ?? this.full[1]]; }
  get L() { return 56; } get R() { return 12; } get T() { return 6; } get B() { return 22; }
  px2x(px) { const [lo, hi] = this.range(); const w = this.canvas.clientWidth - this.L - this.R; return lo + (px - this.L) / w * (hi - lo); }
  nearest(s, x) {
    let a = 0, b = s.x.length - 1;
    if (b < 0) return -1;
    while (b - a > 1) { const m = (a + b) >> 1; if (s.x[m] < x) a = m; else b = m; }
    return Math.abs(s.x[a] - x) <= Math.abs(s.x[b] - x) ? a : b;
  }
  tooltip(e, x) {
    const rows = [el("div", { class: "n", text: `${this.opt.xName || "t [s]"} = ${fmt(x, this.opt.xDigits ?? 3)}` })];
    if (this.opt.extra && this.series.length) { const i = this.nearest(this.series[0], x); if (i >= 0) rows.push(...this.opt.extra(i)); }
    for (const s of this.series) { const i = this.nearest(s, x); if (i >= 0) rows.push(tipRow(s.color, fmt(s.y[i], 2), s.name, s.dashed)); }
    if (this.opt.points) {
      const [lo, hi] = this.range(), tol = (hi - lo) / Math.max(1, this.canvas.clientWidth) * 8;
      for (const p of this.opt.points) if (Math.abs(p.x - x) <= tol) rows.push(el("div", { text: p.label }));
    }
    showTip(e.clientX, e.clientY, rows);
  }
  /* 描画: グラフ本体(軸・線・帯・点)は範囲と大きさが変わったときだけ描いて取っておき(this.base)、
   * 毎回は取っておいた絵をうつして、拡大のドラッグと指している縦線だけを重ねる */
  draw() {
    const c = this.canvas, dpr = window.devicePixelRatio || 1;
    const W = c.clientWidth || 600, H = this.h;
    c.style.height = H + "px";
    const pxW = Math.round(W * dpr), pxH = Math.round(H * dpr);
    if (c.width !== pxW || c.height !== pxH) { c.width = pxW; c.height = pxH; }
    const [lo, hi] = this.range();
    const key = `${pxW}x${pxH}|${lo}|${hi}`;
    if (key !== this.baseKey) {
      if (!this.base) this.base = document.createElement("canvas");
      this.base.width = pxW; this.base.height = pxH;
      const bg = this.base.getContext("2d");
      bg.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.drawBase(bg, W, H, lo, hi);
      this.baseKey = key;
    }
    const g = c.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, pxW, pxH);
    g.drawImage(this.base, 0, 0);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const L = this.L, T = this.T, pw = W - this.L - this.R, ph = H - this.T - this.B;
    const X = (x) => L + (x - lo) / (hi - lo) * pw;
    if (this.drag) { g.fillStyle = css("--sel"); const a = X(this.drag.x0), b = X(this.drag.x1); g.fillRect(Math.min(a, b), T, Math.abs(b - a), ph); }
    if (this.link.hover != null && this.link.hover >= lo && this.link.hover <= hi) {
      g.strokeStyle = this.inkColor || (this.inkColor = css("--ink-2")); g.lineWidth = 1;
      const x = Math.round(X(this.link.hover)) + 0.5; g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke();
    }
  }
  drawBase(g, W, H, lo, hi) {
    g.clearRect(0, 0, W, H);
    let ymin = Infinity, ymax = -Infinity;
    for (const s of this.series) for (let i = 0; i < s.x.length; i++) {
      if (s.x[i] < lo || s.x[i] > hi) continue;
      const v = s.y[i]; if (!isFinite(v)) continue;
      if (v < ymin) ymin = v; if (v > ymax) ymax = v;
    }
    if (!isFinite(ymin)) { ymin = 0; ymax = 1; }
    if (ymax - ymin < 1e-9) { ymin -= 1; ymax += 1; }
    const padY = (ymax - ymin) * 0.06; ymin -= padY; ymax += padY;
    const L = this.L, R = this.R, T = this.T, B = this.B, pw = W - L - R, ph = H - T - B;
    const X = (x) => L + (x - lo) / (hi - lo) * pw, Y = (y) => T + (ymax - y) / (ymax - ymin) * ph;
    g.font = "11px " + css("--sans");
    g.fillStyle = css("--muted");
    g.strokeStyle = css("--grid"); g.lineWidth = 1;
    const yt = niceTicks(ymin, ymax, 4);
    g.textAlign = "right"; g.textBaseline = "middle";
    for (const v of yt.ticks) { const y = Math.round(Y(v)) + 0.5; g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke(); g.fillText(+v.toPrecision(6) + "", L - 6, y); }
    const xt = niceTicks(lo, hi, Math.max(2, Math.floor(pw / 90)));
    g.textAlign = "center"; g.textBaseline = "top";
    for (const v of xt.ticks) { g.fillText(+v.toPrecision(6) + "", X(v), H - B + 5); }
    if (ymin < 0 && ymax > 0) { g.strokeStyle = css("--axis"); const y = Math.round(Y(0)) + 0.5; g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke(); }
    g.save();
    g.beginPath(); g.rect(L, T, pw, ph); g.clip();
    for (const bd of this.opt.bands || []) {
      if (bd.x1 < lo || bd.x0 > hi || !bd.color) continue;
      g.fillStyle = bd.color; g.fillRect(X(bd.x0), T, Math.max(1, X(bd.x1) - X(bd.x0)), ph);
    }
    for (const s of this.series) {
      g.strokeStyle = s.color; g.lineWidth = 2; g.setLineDash(s.dashed ? [6, 4] : []);
      g.lineJoin = "round";
      g.beginPath();
      let started = false;
      /* 点が多いときは、1ピクセルに入る点の最小・最大だけ描く */
      const n = s.x.length;
      let i0 = this.nearest(s, lo), i1 = this.nearest(s, hi);
      i0 = Math.max(0, i0 - 1); i1 = Math.min(n - 1, i1 + 1);
      const per = (i1 - i0) / pw;
      if (per > 2) {
        let col = -1, mn = 0, mx = 0;
        for (let i = i0; i <= i1; i++) {
          const px = Math.floor(X(s.x[i]));
          if (px !== col) {
            if (col >= 0) { g.lineTo(col, Y(mn)); g.lineTo(col, Y(mx)); }
            col = px; mn = mx = s.y[i];
            if (!started) { g.moveTo(px, Y(s.y[i])); started = true; }
          } else { if (s.y[i] < mn) mn = s.y[i]; if (s.y[i] > mx) mx = s.y[i]; }
        }
        if (col >= 0) { g.lineTo(col, Y(mn)); g.lineTo(col, Y(mx)); }
      } else {
        for (let i = i0; i <= i1; i++) { const px = X(s.x[i]), py = Y(s.y[i]); if (!started) { g.moveTo(px, py); started = true; } else g.lineTo(px, py); }
      }
      g.stroke();
    }
    g.setLineDash([]);
    for (const m of this.opt.marks || []) {
      if (m.x < lo || m.x > hi) continue;
      g.strokeStyle = m.color; g.lineWidth = 1; g.setLineDash(m.dashed ? [4, 4] : []);
      const x = Math.round(X(m.x)) + 0.5; g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke();
    }
    g.setLineDash([]);
    for (const p of this.opt.points || []) {
      if (p.x < lo || p.x > hi) continue;
      g.fillStyle = p.color; g.strokeStyle = css("--surface"); g.lineWidth = 2;
      g.beginPath(); g.arc(X(p.x), Y(p.y), 5, 0, Math.PI * 2); g.fill(); g.stroke();
    }
    g.restore();
  }
}

/* ================= 走行ログ ================= */
function parseCSV(b) {
  const cols = b.lines[0].split(",");
  const rows = b.lines.slice(1).map((l) => l.split(",").map(Number)).filter((r) => r.length === cols.length);
  const data = {};
  cols.forEach((c, j) => { data[c] = Float64Array.from(rows, (r) => r[j]); });
  return { cols, data, n: rows.length };
}
const LOG_GROUPS = [
  { title: "速度", unit: "mm/s", cols: [["v", "速度"], ["v_target", "目標"]] },
  { title: "角速度", unit: "deg/s", cols: [["w", "角速度"], ["w_target", "目標"]] },
  { title: "角度(動作ごとに0から)", unit: "deg", cols: [["angle", "角度"]] },
  { title: "横の壁までの距離(区画中心で42。壁合わせのあいだは前センサの値)", unit: "mm", cols: [["dist_L", "左"], ["dist_R", "右"]] },
  { title: "横壁制御", unit: "", cols: [["wall_out", "出力"], ["wall_p", "P項"], ["wall_d", "D項"]] },
  { title: "横壁の誤差", unit: "", cols: [["wall_err", "誤差"]] },
  { title: "使った壁(1 左、2 右、3 両方、0 なし)", unit: "", cols: [["wall", "使った壁"]] },
  { title: "横センサの値(LPFだけ)", unit: "", cols: [["sensor_L", "左"], ["sensor_R", "右"]] },
  { title: "電圧", unit: "V", cols: [["volt_L", "左"], ["volt_R", "右"]] },
  { title: "電池", unit: "V", cols: [["batt", "電池"]] },
];
const LOG_HIDDEN = new Set(["t", "x", "phase"]);	//グラフにしない列
/* 動作の種類(motor.h の LOG_PH_*)。色は区間の帯の色の種類 */
const PHASES = {
  0: { name: "そのほか", band: null }, 1: { name: "直線", band: null }, 2: { name: "斜めの直線", band: null },
  3: { name: "前距離", band: "pp" }, 4: { name: "ターン", band: "turn" }, 5: { name: "後距離", band: "pp" },
  6: { name: "斜めからの前距離", band: "pp" }, 7: { name: "斜めへの後距離", band: "pp" },
  8: { name: "その場旋回", band: "turn" }, 9: { name: "止まる", band: "stop" }, 10: { name: "壁合わせ", band: "stop" },
};
const PHASE_FILTERS = [
  ["all", "全部", () => true], ["straight", "直線", (p) => p === 1 || p === 2], ["pre", "前距離", (p) => p === 3 || p === 6],
  ["turn", "ターン", (p) => p === 4 || p === 8], ["post", "後距離", (p) => p === 5 || p === 7],
];
let logXMode = "t";	//横軸: t 時間 / x 走った距離
function bandColor(kind) {
  const dark = document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  const a = dark ? 0.16 : 0.10;
  if (kind === "turn") return `rgba(98,80,214,${a})`;
  if (kind === "pp") return `rgba(27,175,122,${a})`;
  if (kind === "stop") return `rgba(137,135,129,${a})`;
  return null;
}
function renderLog(view, b) {
  const A = parseCSV(b);

  const colors = [css("--s1"), css("--s2"), css("--s3")];
  const link = new LinkedX();
  const useX = logXMode === "x" && A.data.x;
  const xa = useX ? A.data.x : A.data.t;
  const xb = B ? (useX && B.data.x ? B.data.x : B.data.t) : null;
  const card = el("div", { class: "card" });
  card.append(el("h2", { text: `走行ログ ${timeStr(b.time)}(${A.n} 行、${b.params.div || 1} msおき)` + (B ? ` と ${timeStr(compare.time)}(破線)` : "") }));
  /* 横軸の切り替え */
  const sel = el("select");
  sel.append(el("option", { value: "t", text: "横軸: 時間[s]" }), el("option", { value: "x", text: "横軸: 走った距離[mm]" }));
  sel.value = useX ? "x" : "t";
  if (!A.data.x) sel.disabled = true;
  sel.addEventListener("change", () => { logXMode = sel.value; renderView(); });
  const legend = el("span", { class: "title" });
  for (const [k, n] of [["turn", "ターン"], ["pp", "前距離・後距離"], ["stop", "止まる・壁合わせ"]]) {
    const sw = el("i", { class: "dot" }); sw.style.background = bandColor(k).replace(/[\d.]+\)$/, "0.5)"); sw.style.borderRadius = "2px";
    legend.append(el("span", { class: "key" }, sw, el("span", { text: n })));
  }
  card.append(el("div", { class: "row" }, sel, A.data.phase ? legend : null, link.resetButton()),
    el("div", { class: "note", text: "ドラッグで拡大、ダブルクリックか Esc か「拡大を元に戻す」で元に戻す。グラフを指すと、その時刻の値と動作が出る。左の一覧で別のログに印を付けると破線で重ねる。" }));
  view.append(card);
  /* 動作の区間(帯) */
  const bands = [];
  if (A.data.phase) {
    const ph = A.data.phase;
    let s0 = 0;
    for (let i = 1; i <= A.n; i++) {
      if (i === A.n || ph[i] !== ph[s0]) {
        const info = PHASES[ph[s0]] || PHASES[0];
        if (info.band) bands.push({ x0: xa[s0], x1: xa[Math.min(i, A.n - 1)], color: bandColor(info.band) });
        s0 = i;
      }

  }
  const xName = useX ? "x [mm]" : "t [s]";
  const extra = (i) => {
    const rows = [];
    if (A.data.phase) rows.push(el("div", { class: "n", text: "動作: " + (PHASES[A.data.phase[i]] || PHASES[0]).name }));
    if (A.data.x) rows.push(el("div", { class: "n", text: useX ? `t = ${fmt(A.data.t[i], 3)} s` : `x = ${fmt(A.data.x[i], 1)} mm` }));
    return rows;
  };
  const groups = LOG_GROUPS.filter((gp) => gp.cols.some(([c]) => A.data[c]));
  for (const c of A.cols) if (!LOG_HIDDEN.has(c) && !LOG_GROUPS.some((gp) => gp.cols.some(([k]) => k === c))) groups.push({ title: c, unit: "", cols: [[c, c]] });
  for (const gp of groups) {
    const series = [];
    gp.cols.forEach(([c, name], j) => {
      if (!A.data[c]) return;
      series.push({ name, color: colors[j % 3], x: xa, y: A.data[c] });
      if (B && B.data[c]) series.push({ name: name + "(比較)", color: colors[j % 3], x: xb, y: B.data[c], dashed: true });

function noiseTrace(view, b, N, colors) {

/* 差(平均を引いたもの)と PWM の位置の散布図 */
function noiseScatter(parent, groups) {
  const all = groups.flatMap((g) => g.pts.map((p) => p.y));
  if (!all.length) return;
  let ymin = Math.min(-1, ...all), ymax = Math.max(1, ...all);
  const pad = (ymax - ymin) * 0.08; ymin -= pad; ymax += pad;
  const head = el("div", { class: "title" }, el("span", { text: "差 − 平均 と PWM の位置" }));
  for (const g of groups) { const d = el("i", { class: "dot" }); d.style.background = g.color; head.append(el("span", { class: "key" }, d, el("span", { text: g.name }))); }
  const canvas = el("canvas");
  parent.append(el("div", { class: "chart" }, head, canvas));
  const H = 220, L = 56, R = 12, T = 6, B = 22;
  let hit = [];
  const draw = () => {
    const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth || 600;
    canvas.style.height = H + "px"; canvas.width = W * dpr; canvas.height = H * dpr;

    g.font = "11px " + css("--sans"); g.fillStyle = css("--muted"); g.strokeStyle = css("--grid"); g.lineWidth = 1;
    g.textAlign = "right"; g.textBaseline = "middle";

    g.textAlign = "center"; g.textBaseline = "top";
    for (const v of [0, 0.25, 0.5, 0.75, 1]) g.fillText(v + "", X(v), H - B + 5);
    hit = [];
    for (const gr of groups) for (const p of gr.pts) {
      const cx = X(p.x), cy = Y(p.y);
      g.fillStyle = gr.color; g.globalAlpha = 0.8; g.beginPath(); g.arc(cx, cy, 3, 0, Math.PI * 2); g.fill();

}

/* ================= 迷路 ================= */
function renderMaze(view, b) {
  const N = +b.params.size || 16;
  const get = (tag) => { const a = new Array(N + 1).fill(0); for (const l of b.lines) { const f = l.split(/\s+/); if (f[0] === tag) a[+f[1]] = parseInt(f[2], 16) >>> 0; } return a; };
  const row = get("ROW"), col = get("COL"), lrow = get("LROW"), lcol = get("LCOL");
  const gx = +(b.params.goal_x ?? (N / 2 - 1)), gy = +(b.params.goal_y ?? (N / 2 - 1));
  const card = el("div", { class: "card" });
  card.append(el("h2", { text: `迷路 ${N}×${N}(${timeStr(b.time)})` }),
    el("div", { class: "note", text: "太線: 壁あり、点線: まだ見ていない壁。S: スタート、G: ゴール。" }));
  const canvas = el("canvas");
  card.append(el("div", { class: "maze-wrap" }, canvas));
  view.append(card);
  const draw = () => {
    const size = Math.min(640, (card.clientWidth || 640) - 32), cell = size / (N + 1), off = cell / 2;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = canvas.style.height = size + "px"; canvas.width = canvas.height = size * dpr;
    const g = canvas.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const X = (x) => off + x * cell, Y = (y) => off + (N - y) * cell;
    g.fillStyle = css("--sel");
    g.fillRect(X(gx), Y(gy + 2), cell * 2, cell * 2);
    g.fillStyle = css("--ink-2"); g.font = `${Math.round(cell * 0.45)}px ` + css("--sans"); g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("S", X(0.5), Y(0.5)); g.fillText("G", X(gx + 1), Y(gy + 1));
    const line = (x0, y0, x1, y1, seen, wall) => {
      if (seen && !wall) return;
      g.beginPath(); g.moveTo(X(x0), Y(y0)); g.lineTo(X(x1), Y(y1));
      if (!seen) { g.strokeStyle = css("--axis"); g.lineWidth = 1; g.setLineDash([2, 3]); }
      else { g.strokeStyle = css("--ink"); g.lineWidth = 3; g.setLineDash([]); }
      g.stroke();
    };
    for (let y = 0; y <= N; y++) for (let x = 0; x < N; x++) line(x, y, x + 1, y, (lrow[y] >>> x) & 1, (row[y] >>> x) & 1);
    for (let x = 0; x <= N; x++) for (let y = 0; y < N; y++) line(x, y, x, y + 1, (lcol[x] >>> y) & 1, (col[x] >>> y) & 1);
    g.setLineDash([]);
    g.fillStyle = css("--ink");
    for (let y = 0; y <= N; y++) for (let x = 0; x <= N; x++) g.fillRect(X(x) - 1.5, Y(y) - 1.5, 3, 3);
  };
  new ResizeObserver(draw).observe(card);
  const info = b.lines.filter((l) => /^(unknown walls|TIME_MAX_US|NO PATH|BFS_|DIJK_)/.test(l));
  if (info.length) view.append(el("div", { class: "card" }, el("h2", { text: "経路と計算時間" }), el("pre", { text: info.join("\n") })));
  rawCard(view, b);
}

/* ================= センサの値(そのまま流れてくる行) ================= */
/* モード4 No.0: FL = %4d // L = %4d // R = %4d //FR = %4d //BATT = %.2f//GyroZ = %.3f
 * モード3 No.4: CAL,FL,L,R,FR,FL_mm,L_mm,R_mm,FR_mm
 * どちらも #BEGIN で囲まないので、行ごとに読み取って、直近の値を流れるグラフにする */
const LIVE = { type: "LIVE" };
const LIVE_KEEP_S = 60;	//覚えておく長さ[s]
const LIVE_SHOW_S = 10;	//グラフに出す長さ[s]
const live = { kind: null, t: [], cols: {}, t0: 0, rate: 0, count: 0, rateT: 0, paused: false };
const RE_SENSOR = /FL\s*=\s*(-?\d+)\s*\/\/\s*L\s*=\s*(-?\d+)\s*\/\/\s*R\s*=\s*(-?\d+)\s*\/\/\s*FR\s*=\s*(-?\d+)\s*\/\/\s*BATT\s*=\s*(-?[\d.]+)\s*\/\/\s*GyroZ\s*=\s*(-?[\d.]+)/;
const LIVE_COLS = {
  sensor: ["FL", "L", "R", "FR", "BATT", "GyroZ"],
  cal: ["FL", "L", "R", "FR", "FL_mm", "L_mm", "R_mm", "FR_mm"],
};
function liveLine(line) {
  let kind = null, vals = null;
  const m = line.match(RE_SENSOR);
  if (m) { kind = "sensor"; vals = m.slice(1).map(Number); }
  else if (/^CAL,-?\d/.test(line)) { const f = line.split(",").slice(1).map(Number); if (f.length >= 8 && f.every(isFinite)) { kind = "cal"; vals = f.slice(0, 8); } }
  if (!kind || live.paused) return;
  /* USBシリアルは数行まとめて届くので、同じときに届いた行は、前に届いた時刻から今までのあいだに等間隔に並べる */
  livePending.push([kind, vals]);
  if (livePending.length === 1) queueMicrotask(liveFlush);
}
let livePending = [], liveLastArrive = 0;
function liveFlush() {
  const batch = livePending; livePending = [];
  const now = performance.now() / 1000;
  const prev = (liveLastArrive && now - liveLastArrive < 0.5) ? liveLastArrive : now - 0.01 * batch.length;
  liveLastArrive = now;
  batch.forEach(([kind, vals], k) => livePush(kind, vals, prev + (now - prev) * (k + 1) / batch.length, now));
}
function livePush(kind, vals, tAt, now) {
  const first = !live.t.length;
  if (live.kind !== kind) { live.kind = kind; live.t = []; live.cols = {}; live.t0 = tAt; for (const c of LIVE_COLS[kind]) live.cols[c] = []; }
  live.t.push(tAt - live.t0);
  LIVE_COLS[kind].forEach((c, j) => live.cols[c].push(vals[j]));
  const keepFrom = live.t[live.t.length - 1] - LIVE_KEEP_S;
  let cut = 0;
  while (cut < live.t.length && live.t[cut] < keepFrom) cut++;
  if (cut > 500) { live.t.splice(0, cut); for (const c in live.cols) live.cols[c].splice(0, cut); }
  live.count++;
  if (now - live.rateT >= 1) { live.rate = Math.round(live.count / (now - live.rateT || 1)); live.count = 0; live.rateT = now; liveListDirty = true; }
  if (first) liveListDirty = true;
  liveDirty = true;
}
let liveDirty = false, liveListDirty = false, liveView = null;
setInterval(() => {
  if (liveListDirty) { liveListDirty = false; renderList(); }
  if (liveDirty && selected === LIVE && liveView) { liveDirty = false; liveView.update(); }
}, 150);
function renderLive(view) {
  const card = el("div", { class: "card" });
  const pause = el("button", { text: live.paused ? "再開" : "止める" });
  pause.addEventListener("click", () => { live.paused = !live.paused; pause.textContent = live.paused ? "再開" : "止める"; });
  const save = el("button", { text: "ファイルに保存(CSV)" });
  save.addEventListener("click", () => {
    const cols = LIVE_COLS[live.kind] || [];
    const rows = ["t," + cols.join(",")];
    for (let i = 0; i < live.t.length; i++) rows.push([live.t[i].toFixed(3), ...cols.map((c) => live.cols[c][i])].join(","));
    download(`${stamp(new Date())}_sensor.csv`, rows.join("\n") + "\n");
  });
  const tiles = el("div", { class: "row" });
  card.append(el("h2", { text: live.kind === "cal" ? "距離の表(モード3 No.4)の値" : "センサの値(モード4 No.0)" }),
    el("div", { class: "row" }, pause, save, el("span", { class: "note", text: `直近${LIVE_SHOW_S}秒を流れるグラフにする(覚えているのは${LIVE_KEEP_S}秒)。指すと値が出る。` })),
    tiles);
  view.append(card);
  const colors = [css("--s1"), css("--s2"), css("--s3"), css("--s4")];
  const groups = live.kind === "cal"
    ? [{ title: "センサ値", unit: "", cols: ["FL", "L", "R", "FR"] }, { title: "距離(今の表で変換)", unit: "mm", cols: ["FL_mm", "L_mm", "R_mm", "FR_mm"] }]
    : [{ title: "センサ値(10回の移動平均)", unit: "", cols: ["FL", "L", "R", "FR"] }, { title: "電池", unit: "V", cols: ["BATT"] }, { title: "角速度", unit: "deg/s", cols: ["GyroZ"] }];
  const link = new LinkedX();
  const charts = groups.map((g) => {
    const series = g.cols.map((c, j) => ({ name: c, color: colors[j % 4], x: live.t, y: live.cols[c] || [] }));
    return { g, chart: new LineChart(card, g.title, g.unit, series, link, 170, { xName: "t [s]", xDigits: 2 }) };
  });
  const tileCols = live.kind === "cal" ? LIVE_COLS.cal : LIVE_COLS.sensor;
  const tileEls = tileCols.map((c) => { const v = el("b", { text: "-" }); tiles.append(el("div", { class: "tile" }, el("div", { class: "note", text: c }), v)); return [c, v]; });
  liveView = {
    update() {
      const n = live.t.length;
      if (!n) return;
      const t1 = live.t[n - 1], t0 = Math.max(live.t[0], t1 - LIVE_SHOW_S);
      for (const { chart } of charts) {
        for (const s of chart.series) { s.x = live.t; s.y = live.cols[s.name] || []; }
        chart.full = [t0, Math.max(t1, t0 + 0.001)];
        chart.draw();
      }
      for (const [c, v] of tileEls) { const a = live.cols[c]; if (a && a.length) v.textContent = String(a[a.length - 1]); }
    },
  };
  liveView.update();
}

/* ================= 感度合わせ・そのほか ================= */
function copyLine(text) {
  const btn = el("button", { text: "コピー" });
  btn.addEventListener("click", async () => { try { await navigator.clipboard.writeText(text); btn.textContent = "コピーした"; setTimeout(() => (btn.textContent = "コピー"), 1200); } catch (e) { /* */ } });
  return el("div", { class: "copyline" }, btn, el("code", { text }));
}
function renderCenter(view, b) {
  const card = el("div", { class: "card" });
  card.append(el("h2", { text: `感度合わせ ${timeStr(b.time)}` }));
  for (const l of b.lines) {
    const m = l.match(/^(\S+\.c):\s+(.*)$/);
    if (m) { card.append(el("h3", { text: m[1] }), copyLine(m[2])); }
    else card.append(el("div", { class: "note", text: l }));
  }
  view.append(card);
  rawCard(view, b);
}
/* センサ値の記録(SENSOR)の行を読む。行は「名前,平均,いちばん小さい値,いちばん大きい値」 */
function sensorRows(b) {
  const rows = [];
  for (const l of b.lines) {
    const f = l.split(",");
    if (f.length >= 4 && isFinite(+f[1])) rows.push({ name: f[0], average: +f[1], min: +f[2], max: +f[3] });
  }
  return rows;
}
/* センサ値の記録：この記録の表と、読み込んだ全部の記録の一覧(メモごと。表にコピーしやすい形) */
function renderSensor(view, b) {
  const card = el("div", { class: "card" });
  card.append(el("h2", { text: `センサ値の記録 ${timeStr(b.time)}` + (b.memo ? ` [${b.memo}]` : "") }));
  const t = el("table");
  t.append(el("tr", null, ...["センサ", "平均", "いちばん小さい", "いちばん大きい", "ゆれ(大 − 小)"].map((h, j) => el("th", { class: j === 0 ? "l" : "", text: h }))));
  for (const r of sensorRows(b)) t.append(el("tr", null, el("td", { class: "l", text: r.name }), el("td", { text: fmt(r.average, 1) }), el("td", { text: fmt(r.min, 0) }), el("td", { text: fmt(r.max, 0) }), el("td", { text: fmt(r.max - r.min, 0) })));
  card.append(t);
  view.append(card);

  const all = blocks.filter((x) => x.type === "SENSOR");
  const card2 = el("div", { class: "card" });
  card2.append(el("h2", { text: `読み込んだセンサ値の記録 ${all.length} 個(平均)` }),
    el("div", { class: "note", text: "logs/ のファイルをまとめて開くと、ここに全部並ぶ。下の文字は、そのまま表計算やチャットに貼れる。" }));
  const lines = ["memo,time,FL,L,R,FR"];
  for (const x of all) {
    const v = {};
    for (const r of sensorRows(x)) v[r.name] = r.average;
    lines.push([x.memo, timeStr(x.time), v.FL, v.L, v.R, v.FR].join(","));
  }
  const cl = copyLine(lines.join("\n"));
  cl.style.alignItems = "flex-start";
  cl.querySelector("code").style.whiteSpace = "pre";	//1 行ずつ改行して見せる
  card2.append(cl);
  view.append(card2);
  rawCard(view, b);
}
function rawCard(view, b) {
  const btn = el("button", { text: "ファイルに保存" });
  btn.addEventListener("click", () => download(fileName(b), b.raw));
  const pre = el("pre", { text: b.raw.length > 200000 ? b.raw.slice(0, 200000) + "\n…(長いので途中まで)" : b.raw });
  pre.style.maxHeight = "240px";
  const det = el("details", null, el("summary", { text: "元のデータ" }), pre);
  view.append(el("div", { class: "card" }, el("div", { class: "row" }, btn, el("span", { class: "note", text: fileName(b) })), det));
}
function renderView() {
  const view = $("view");
  view.replaceChildren();
  zoomResetters = [];
  hideTip();
  const b = selected;
  if (!b) { view.append(welcome()); return; }
  try {
    if (b.type === "LOG") renderLog(view, b);
    else if (b.type === "EDGE") renderEdge(view, b);
    else if (b.type === "MAZE") renderMaze(view, b);
    else if (b.type === "CENTER") renderCenter(view, b);
    else if (b.type === "SENSOR") renderSensor(view, b);
    else if (b.type === "NOISE") renderNoise(view, b);
    else if (b === LIVE) renderLive(view);
    else rawCard(view, b);
  } catch (e) {
    view.append(el("div", { class: "card warn", text: "表示できませんでした: " + e.message }));
    rawCard(view, b);
  }
}
function welcome() {
  const d = el("div", { class: "empty" });
  d.append(el("h2", { text: "ロボットをUSBシリアルでつなぎ、「接続」を押す" }),
    el("p", { text: "Tera Term は閉じておく。「保存先フォルダ」でリポジトリの logs/ を選ぶと、届いたデータを自動でファイルにする。" }),
    el("p", { text: "ロボットでモード7 No.1(ログ出力)を選ぶと、残っているデータ(調整の結果・センサ値の記録・迷路・走行ログ)が全部届き、種類ごとに分けて表示する。センサ値の表示(モード5 No.1)は、流れるグラフになる。" }),
    el("p", { text: "「メモ」に、測った条件(例: R 64mm)を書いてからデータを出すと、ファイル名と中身に入る。" }));
  if (!("serial" in navigator)) d.append(el("p", { class: "warn", text: "このブラウザでは USB シリアルを読めません(Windows の Chrome か Edge で開く)。保存したファイルを開いて見ることはできる。" }));
  return d;
}

/* ================= ボタン ================= */
$("bConnect").addEventListener("click", connect);
$("bDisconnect").addEventListener("click", disconnect);
$("bDir").addEventListener("click", pickDir);
$("bOpen").addEventListener("click", () => $("fOpen").click());
$("fOpen").addEventListener("change", (e) => { openFiles([...e.target.files]); e.target.value = ""; });
$("bSession").addEventListener("click", saveSession);
$("bConsole").addEventListener("click", () => $("console").classList.toggle("hide"));
$("bClear").addEventListener("click", () => { consoleLines.length = 0; consoleDirty = true; });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); openFiles([...e.dataTransfer.files]); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderView);
renderView();
</script>
